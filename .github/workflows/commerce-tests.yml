name: Commerce tools tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  commerce-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test GiftFinder and PriceWatch logic
        run: node --test tests/commerce.test.mjs
